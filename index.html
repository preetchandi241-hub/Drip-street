 <div id="product-modal" class="hidden">
  <div class="product-modal-content">
    <button id="product-modal-close" type="button">✕ Close</button>

    <div class="product-detail-layout">
      <img id="detail-image" src="" alt="Product photo">

      <div class="product-detail-info">
        <p id="detail-category"></p>
        <h2 id="detail-name"></h2>
        <h3 id="detail-price"></h3>
        <p id="detail-description"></p>

        <label for="detail-size">Choose size:</label>
        <select id="detail-size">
          <option value="S">S</option>
          <option value="M" selected>M</option>
          <option value="L">L</option>
          <option value="XL">XL</option>
        </select>

        <button id="detail-add" type="button">
          ADD TO CART +
        </button>
      </div>
    </div>
  </div>
</div>
